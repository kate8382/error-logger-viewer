services:
  backend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "npm install && npm run dev:backend"
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "npm install && until wget -qO- http://backend:3000/errors >/dev/null 2>&1; do echo '[frontend] waiting for backend...'; sleep 1; done && npm run dev:frontend"
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
      - API_PROXY_TARGET=http://backend:3000
    depends_on:
      - backend
