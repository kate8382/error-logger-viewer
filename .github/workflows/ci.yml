name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  tests-frontend:
    name: 'Frontend (unit + coverage)'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.16.0'

      - name: Install deps (root)
        run: npm ci

      - name: Run frontend unit tests and coverage
        run: npm run test:coverage:frontend -- --coverageDirectory=coverage/frontend --silent

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: coverage/frontend

  tests-backend:
    name: 'Backend (unit + coverage)'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.16.0'

      - name: Install deps (root)
        run: npm ci

      - name: Run backend unit tests and coverage
        run: npm run test:coverage:backend -- --coverageDirectory=coverage/backend --silent

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: coverage/backend

  frontend-e2e:
    name: 'Frontend: e2e'
    runs-on: ubuntu-latest
    needs:
      - tests-frontend
      - tests-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.16.0'

      - name: Install deps (root)
        run: npm ci

      - name: Build production bundle
        run: npm run build:types && npm run build:frontend

      - name: Serve production build in background
        run: |
          npm run serve:dist:frontend &
          echo "waiting for server..." && sleep 2

      - name: Start backend server
        run: |
          nohup npm run dev:backend &
          echo "waiting for backend..."
          for i in 1 2 3 4 5; do
            if curl -sS http://localhost:3000/errors >/dev/null 2>&1; then
              echo "backend ready"
              break
            fi
            echo "waiting for backend... ($i)"
            sleep 2
          done
          if ! curl -sS http://localhost:3000/errors >/dev/null 2>&1; then
            echo "Backend did not become ready in time" >&2
            exit 1
          fi

      - name: Install Cypress
        run: npm ci --no-audit --no-fund --silent && npm i cypress@15 --no-save

      - name: Run Cypress headless (e2e from tests/e2e)
        env:
          CYPRESS_BASE_URL: http://localhost:8080
        run: |
          npm run test:e2e --silent 2>&1 | tee cypress-run.log

      - name: Upload Cypress artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            tests/e2e/screenshots
            tests/e2e/videos
            tests/e2e/logs
            cypress-run.log

      - name: Upload dist artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: frontend/dist

      - name: Push frontend/dist + backend/dist to cpanel-deploy
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TMPDIR=$(mktemp -d)
          cp -R frontend/dist "$TMPDIR/frontend"
          if [ -d backend/dist ]; then
            cp -R backend/dist "$TMPDIR/backend"
          fi
          cd "$TMPDIR"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "CI: deploy artifacts $GITHUB_SHA" || echo "no changes to commit"
          git branch -M cpanel-deploy
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git push --force-with-lease origin cpanel-deploy

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.16.0'

      - name: Install deps (root)
        run: npm ci

      - name: Run ESLint
        run: npm run lint:all || true
