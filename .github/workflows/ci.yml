name: CI

on:
  push:
    branches:
      - main
      - 'feat/*'
      - '*-ts'
  pull_request:
    branches:
      - main

jobs:
  frontend-tests:
    name: 'CI / Frontend: tests & e2e'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.16.0'

      - name: Install frontend deps
        run: npm ci

      - name: Run unit tests (Jest)
        run: npm test --silent

      - name: Build production bundle
        run: npm run build

      - name: Serve production build in background
        run: |
          npm run serve:dist &
          echo "waiting for server..." && sleep 2

      - name: Start backend server
        run: |
          pushd ../backend
          npm ci
          nohup node server.js &
          popd
          echo "waiting for backend..."
          for i in 1 2 3 4 5; do
            if curl -sS http://localhost:3000/errors >/dev/null 2>&1; then
              echo "backend ready"
              break
            fi
            echo "waiting for backend... ($i)"
            sleep 2
          done
          if ! curl -sS http://localhost:3000/errors >/dev/null 2>&1; then
            echo "Backend did not become ready in time" >&2
            exit 1
          fi

      - name: Install Cypress
        run: npm i cypress@15 --no-save

      - name: Run Cypress headless
        env:
          CYPRESS_baseUrl: http://localhost:8080
        run: |
          npx cypress run --browser electron 2>&1 | tee cypress-run.log

      - name: Upload Cypress artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            frontend/cypress/screenshots
            frontend/cypress/videos
            frontend/cypress/logs
            frontend/cypress-run.log

  backend-tests:
    name: 'CI / Backend: tests'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (backend)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install backend deps
        run: |
          cd backend
          npm ci

      - name: Run backend tests
        run: |
          cd backend
          npm test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.16.0'

      - name: Install deps
        run: npm ci

      - name: Run ESLint
        run: npm run lint || true
