name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  frontend-tests:
    name: 'Frontend: tests & e2e'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.16.0'

      - name: Install deps (root)
        run: npm ci

      - name: Run frontend unit tests (Jest)
        run: npm run test:frontend --silent

      - name: Build production bundle
        run: npm run build:frontend

      - name: Serve production build in background
        run: |
          npm run serve:dist:frontend &
          echo "waiting for server..." && sleep 2

      - name: Start backend server
        run: |
          nohup npm run dev:backend &
          echo "waiting for backend..."
          for i in 1 2 3 4 5; do
            if curl -sS http://localhost:3000/errors >/dev/null 2>&1; then
              echo "backend ready"
              break
            fi
            echo "waiting for backend... ($i)"
            sleep 2
          done
          if ! curl -sS http://localhost:3000/errors >/dev/null 2>&1; then
            echo "Backend did not become ready in time" >&2
            exit 1
          fi

      - name: Install Cypress
        run: npm ci --no-audit --no-fund --silent && npm i cypress@15 --no-save

      - name: Run Cypress headless (e2e from tests/e2e)
        env:
          CYPRESS_BASE_URL: http://localhost:8080
        run: |
          npm run test:e2e --silent 2>&1 | tee cypress-run.log

      - name: Upload Cypress artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            tests/e2e/screenshots
            tests/e2e/videos
            tests/e2e/logs
            cypress-run.log

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage

      - name: Upload dist artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: frontend/dist

  backend-tests:
    name: 'Backend: tests'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (backend)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install deps (root)
        run: npm ci

      - name: Run backend tests
        run: npm run test:backend

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.16.0'

      - name: Install deps (root)
        run: npm ci

      - name: Run ESLint
        run: npm run lint:all || true
