name: Dismiss "Request Changes" Review

# This workflow dismisses a "Request Changes" review so it becomes informational only.
# After dismissal the review is NOT deleted — it stays visible with all comments, but it
# is marked "Dismissed" and no longer blocks merging the PR.
#
# Default values target PR #63 (Docker containerization PR) and review ID 3982525496
# (the "Request Changes" review left by kate8382). Adjust the inputs when running
# for a different PR or review.
#
# Suggested dismissal message (also used as the default below):
#   "Dismissing my own review. The suggestions above are valuable improvements I'd like
#    to see addressed, but they are not blocking this contribution from being merged.
#    Please consider opening follow-up issues or PRs for the remaining items."

on:
  workflow_dispatch:
    inputs:
      pull_number:
        description: 'Pull Request number (default: 63 — Docker PR)'
        required: true
        default: '63'
      review_id:
        description: 'Review ID to dismiss (default: 3982525496 — Request Changes review on PR #63)'
        required: true
        default: '3982525496'
      message:
        description: 'Dismissal message'
        required: false
        default: 'Dismissing my own review. The suggestions above are valuable improvements I would like to see addressed, but they are not blocking this contribution from being merged. Please consider opening follow-up issues or PRs for the remaining items.'

permissions:
  pull-requests: write

jobs:
  dismiss-review:
    name: Dismiss Request Changes Review
    runs-on: ubuntu-latest
    steps:
      - name: Dismiss review via GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISMISS_MESSAGE: ${{ inputs.message }}
        run: |
          gh api \
            -X PUT \
            "/repos/${{ github.repository }}/pulls/${{ inputs.pull_number }}/reviews/${{ inputs.review_id }}/dismissals" \
            -f message="$DISMISS_MESSAGE"

      - name: Post follow-up comment on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISMISS_MESSAGE: ${{ inputs.message }}
          REVIEW_ID: ${{ inputs.review_id }}
        run: |
          jq -n \
            --arg review_id "$REVIEW_ID" \
            --arg msg "$DISMISS_MESSAGE" \
            '{"body": ("**Review status updated** ✅\n\nThe \"Request Changes\" review (ID `" + $review_id + "`) has been dismissed.\n\n**What this means:**\n- The review is still fully visible with all its comments — it has **not** been deleted.\n- It is now marked **Dismissed** and no longer blocks merging this PR.\n- All suggestions remain as informational feedback to consider in follow-up work.\n\nDismissal message: *" + $msg + "*")}' | \
          gh api \
            -X POST \
            "/repos/${{ github.repository }}/issues/${{ inputs.pull_number }}/comments" \
            --input -

      - name: Confirm dismissal
        run: |
          echo "Review ${{ inputs.review_id }} on PR #${{ inputs.pull_number }} has been dismissed."
          echo "A follow-up comment was posted on the PR explaining the change."
          echo "The review suggestions remain as informational comments."
