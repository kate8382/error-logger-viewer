version: '3.8'
services:
  static-frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ../:/app:delegated
    environment:
      - NODE_ENV=development
    entrypoint: ["sh","-c","npm ci --no-audit --prefer-offline && npm run build:frontend && npx http-server frontend/dist -p 8080 -c-1"]
    depends_on:
      - backend
  cypress:
    image: cypress/included:12.17.4
    working_dir: /e2e
    volumes:
      - ../:/e2e:delegated
    entrypoint: ["sh","-c","npx cypress run --config baseUrl=http://static-frontend:8080 --config-file tests/e2e/cypress.config.ts"]
    command: []
    depends_on:
      - static-frontend
