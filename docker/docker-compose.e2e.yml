version: '3.8'
services:
  static-frontend:
    image: nginx:alpine
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
    ports:
      - "8080:80"
    depends_on:
      - backend
  cypress:
    build:
      context: ..
      dockerfile: docker/cypress.Dockerfile
    image: error-logger-viewer-cypress:local
    working_dir: /e2e
    environment:
      - CYPRESS_BASE_URL=http://static-frontend:80
    depends_on:
      - static-frontend
