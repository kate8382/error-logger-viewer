version: '3.8'
services:
  static-frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ../:/app:delegated
    environment:
      - NODE_ENV=development
    entrypoint: ["sh","-c","npm ci --no-audit --prefer-offline && npm run build:frontend && npx http-server frontend/dist -p 8080 -c-1"]
    depends_on:
      - backend
  cypress:
    build:
      context: ..
      dockerfile: docker/cypress.Dockerfile
    image: error-logger-viewer-cypress:local
    working_dir: /e2e
    environment:
      - CYPRESS_BASE_URL=http://static-frontend:8080
    depends_on:
      - static-frontend
