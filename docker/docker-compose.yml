services:
  app:
    build: ..
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DB_FILE=/app/data/db.json
    volumes:
      - app-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/errors').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    command: npm run start:backend

volumes:
  app-data:
